# ============================================
# pnpm workspace 配置
# ============================================
# 声明 monorepo 中各子项目的路径。
# packages/ 和 platforms/ 下所有子目录都会被识别为独立的 pnpm 包，
# 它们共享同一份 node_modules 和 lockfile。
packages:
  - 'packages/*'
  - 'platforms/*'
allowBuilds:
  electron: true
  electron-builder: true
  electron-winstaller: true
  esbuild: true
  vue-demi: true
