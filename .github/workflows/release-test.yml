# Test Release（滚动发布）
#
# 目的：每次 push 到 main 都重新打包各平台产物，并生成**唯一的 test release**：
#   1. 构建前端产物（zip）+ Web 单进程版（platforms/web 自带打包脚本 → liferestart-web.zip）
#   2. 构建桌面版（platforms/electron 的 electron-builder 产物，Windows runner 出 exe）
#   3. 构建移动版（platforms/mobile：现场 cap add android + Gradle assembleDebug → apk）
#   4. **先删掉上一个 test release（连同 tag）**，再用本次产物创建新的 test release
# 这样 release 页面始终只有一个 "test"，代表最新一次提交的可下载产物。
#
# 为什么必须是**正式**（非 prerelease）release：
#   用 `gh release create --prerelease` 时，侧栏 "Releases" 与 /releases/latest 都不显示它，
#   看起来就像"根本没发布过"（曾经被这样反馈过）。所以这里用 `--latest`。
#
# 与其它工作流的分工：
#   · test.yml         → 跑全量测试（含 platforms/mobile 的脚本与 CI 不变量测试）
#   · deploy-pages.yml → 只发布网页版到 Pages
#   · release-test.yml → 本文件：产出**可下载的打包产物**（含桌面版/移动版），不碰 Pages
#
# 说明：本文件与 deploy-pages.yml 用同一套 node/pnpm 设置（版本来自根 packageManager 字段），
# 冻结安装保证依赖可复现。
#
# 另：`platforms/mobile/release-workflow.spec.js` 会对本文件做结构断言
# （JDK 版本、APK 平铺上传、递归收集、--latest、先校验后删除）——改本文件请一并跑该测试。

name: Test Release

on:
  # 每次 push 到 main 都重建（滚动更新）。
  push:
    branches: [main]
  # 允许手动触发（排查打包问题用）。
  workflow_dispatch:

# 创建/删除 release 需要写权限（默认 token 通常只读）。
permissions:
  contents: write

jobs:
  # ---------- 网页版产物：前端 dist + Web 单进程 zip ----------
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm（前端依赖 game-engine: workspace:*，npm 不支持 workspace 协议）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端产物（含同步 Mods：package.json 的 build 脚本会先跑 scripts/sync-mods.mjs）。
      - name: Build frontend
        run: pnpm --filter frontend build

      # 构建校验：数据文件与 Mod 索引必须在产物里（缺任一个都会让网页版静默降级）。
      - name: Verify frontend build output
        run: |
          test -f packages/frontend/dist/index.html
          test -f packages/frontend/dist/data/age.json
          test -f packages/frontend/dist/mods/index.json
          echo "前端产物校验通过"

      # Web 单进程版（静态 + 内嵌 AI 代理，解压即运行）。
      - name: Build web platform (single-process zip)
        run: |
          cd platforms/web
          node scripts/build.js
          test -f release/liferestart-web.zip

      # 打进 release 的产物：前端 dist 压缩包 + Web 单进程 zip。
      - name: Collect artifacts
        run: |
          mkdir -p out
          cp platforms/web/release/liferestart-web.zip out/
          cd packages/frontend && zip -qr ../../out/liferestart-frontend-dist.zip dist
          ls -lh ../../out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-artifacts
          path: out/*.zip
          if-no-files-found: error

  # ---------- 桌面版产物（electron-builder） ----------
  # 用 windows runner 直接出 exe（在 Linux 上打 Windows 目标需要 wine，容易在 CI 里翻车）。
  # 注意：这一步依赖 platforms/electron 自己的 electron-builder 配置；若配置改动导致失败，
  # 本 job 会**直接让 release 失败**（不再用 continue-on-error 掩盖——那会让"产物缺失"看起来像绿灯）。
  electron:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package desktop app
        working-directory: platforms/electron
        run: npx electron-builder --win --publish never

      - name: List release output
        working-directory: platforms/electron
        run: Get-ChildItem -Recurse release -File | Select-Object -First 20 FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-artifacts
          # electron-builder 默认输出到 release/（exe/安装包）。
          path: platforms/electron/release/*.exe
          if-no-files-found: warn

  # ---------- 移动版产物（Capacitor + Gradle debug APK，内置 Node 运行时） ----------
  # android/ 原生工程不入库（Gradle 工程含大量生成物与二进制）：每次 CI 现场 cap add 重建，
  # 再由 scripts/prepare-android.js 把「APK 内置 Node 运行时」接进去（官方 nodejs-mobile v18.20.4）：
  #   assets/nodejs-project/（main.js + 打包好的 game-engine AI 代理）+ libnode.so + JNI 壳（CMake）
  #   → 设备上 Node 监听 127.0.0.1:8787，WebView 里的前端直连它（三端共用同一份代理实现）。
  # JDK 必须是 21（Capacitor 7 / AGP 8.11+）：用 17 会在 `Build debug APK` 阶段直接失败
  # （已在 run 36992811506 上复现，换 21 后 run 36993418144 起稳定通过）。
  mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Capacitor 7 / AGP 8.11+ 要求 JDK 21（用 17 会在 Gradle 阶段报 class file/AGP 版本错误）。
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Prepare web assets (dist to www)
        working-directory: platforms/mobile
        run: npm run build

      # 诊断快照：失败时不用再猜（Java/SDK 平台/构建工具/NDK/CMake/www 内容）。
      - name: Diagnostics
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-未设置} ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-未设置}"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-未设置}"
          ls "${ANDROID_HOME}/platforms" || true
          ls "${ANDROID_HOME}/build-tools" || true
          ls "${ANDROID_HOME}/ndk" || true
          ls "${ANDROID_HOME}/cmake" || true
          ls -la platforms/mobile/www | head -20

      # AGP 构建前必须已接受 SDK 许可，否则 assembleDebug 直接失败。
      - name: Accept Android SDK licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then yes | "$SDKMANAGER" --licenses > /dev/null || true; fi

      - name: Add Android platform and sync
        working-directory: platforms/mobile
        run: |
          npx cap add android
          npx cap sync android

      # 显式写 sdk.dir（AGP 有时读不到 ANDROID_HOME）。
      - name: Point Gradle at the Android SDK
        working-directory: platforms/mobile/android
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      # 显式指定 CMake 版本为 SDK 里最高的 3.x：runner 上同时装了 3.31.5 与 4.1.2，
      # 不指定的话 AGP 可能挑到 CMake 4，而 NDK 的 toolchain 文件未必兼容
      # （见 android-patch/gradle/nodejs.gradle 里的说明）。
      - name: Pin CMake version for Gradle
        run: |
          if [ -d "${ANDROID_HOME}/cmake" ]; then
            CMAKE_VERSION=$(ls "${ANDROID_HOME}/cmake" | grep -E '^3\.' | sort -V | tail -1)
            if [ -n "$CMAKE_VERSION" ]; then
              echo "LIFERESTART_CMAKE_VERSION=${CMAKE_VERSION}" >> "$GITHUB_ENV"
              echo "使用 CMake ${CMAKE_VERSION}"
            else
              echo "SDK 里没有 3.x 的 CMake，交给 AGP 自行选择"
            fi
          else
            echo "SDK 里没有 cmake 目录，交给 AGP 自行选择"
          fi

      # 官方 nodejs-mobile 运行时（预编译 libnode.so + 头文件）。
      # 这是会随 APK 分发到用户设备的二进制，所以固定版本 + 校验 sha256（供应链）。
      - name: Fetch nodejs-mobile runtime (pinned + sha256)
        run: |
          curl -fsSL -o /tmp/nodejs-mobile-android.zip \
            https://github.com/nodejs-mobile/nodejs-mobile/releases/download/v18.20.4/nodejs-mobile-v18.20.4-android.zip
          echo "bd7321eaa1a7602fbe0bb87302df2d79d87835cf4363fbdd17c350dbb485c2af  /tmp/nodejs-mobile-android.zip" | sha256sum -c -
          mkdir -p platforms/mobile/.libnode
          unzip -q /tmp/nodejs-mobile-android.zip -d platforms/mobile/.libnode
          test -f platforms/mobile/.libnode/include/node/node.h
          ls -la platforms/mobile/.libnode/bin/*/libnode.so

      # 把 APK 内置 Node 侧（AI 代理）打包成 CJS 单文件，并用桌面 Node 冒烟跑一遍。
      # 设备上跑的是**同一份 JS**，所以这一步能排掉"代码/打包错"这一大类问题。
      - name: Build embedded Node project (bundle + smoke)
        working-directory: platforms/mobile
        run: |
          node scripts/build-node-project.js
          node scripts/smoke-node-project.js

      # 把运行时/JNI/Java/Gradle/清单/Node 工程接进现场生成的 Android 工程。
      - name: Patch Android project (nodejs-mobile integration)
        working-directory: platforms/mobile
        run: node scripts/prepare-android.js --libnode .libnode

      # Gradle 失败的真正原因在日志里，而 Actions 日志接口需要 admin 权限（本地读不到），
      # 所以这里把输出落盘，失败时用 `::error::` 注解把末尾原因带到 check-run 注解上（公开可读）。
      - name: Build debug APK
        working-directory: platforms/mobile/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/gradle.log 2>&1
          code=$?
          echo "gradle exit=$code"
          if [ $code -ne 0 ]; then
            tail -40 /tmp/gradle.log
            # 注解正文：换行转 %0A（GitHub 注解要求），并转义 %
            MSG=$(tail -c 1500 /tmp/gradle.log | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Gradle assembleDebug 失败::${MSG}"
            exit $code
          fi
          echo "APK 构建成功"

      - name: Verify APK
        working-directory: platforms/mobile
        run: |
          find android/app/build/outputs/apk -name '*.apk' -exec ls -lh {} \;
          test -n "$(find android/app/build/outputs/apk -name '*.apk')"

      # 校验 APK 里**真的**带了内置 Node 运行时。为什么必须查：
      # "没打进去"在 job 绿着的情况下完全可能发生（此前 APK 就被 upload-artifact 的子目录规则吞过一次），
      # 而设备上的表现是"AI 用不了"，排查成本极高。
      - name: Verify embedded Node runtime inside APK
        working-directory: platforms/mobile
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "APK: ${APK}（$(du -h "$APK" | cut -f1)）"
          unzip -l "$APK" > /tmp/apk-list.txt
          fail() { echo "::error title=APK 内容校验失败::$1"; exit 1; }
          check() { grep -q "$1" /tmp/apk-list.txt || fail "$2（APK 里找不到 $1）"; }
          # Node 侧脚本（设备上真正执行的 JS）。
          check 'assets/nodejs-project/main.js' 'Node 入口脚本没打进 APK'
          check 'assets/nodejs-project/proxy.js' '打包好的 AI 代理没打进 APK'
          # 原生侧：libnode + 我们的 JNI 壳 + libC++ 共享库（libnode 依赖它）。
          check 'lib/arm64-v8a/libnode.so' 'libnode.so（arm64）没打进 APK'
          check 'lib/arm64-v8a/libnodejs_jni.so' 'JNI 壳没打进 APK'
          check 'lib/arm64-v8a/libc++_shared.so' 'libc++_shared.so 没打进 APK（libnode 依赖它）'
          # 清单：INTERNET 权限 + 只对回环放开明文 HTTP 的网络策略。
          MANIFEST=/tmp/manifest.txt
          AAPT2=$(ls "${ANDROID_HOME}"/build-tools/*/aapt2 2>/dev/null | tail -1)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "$MANIFEST" 2>/dev/null || true
          fi
          if [ ! -s "$MANIFEST" ]; then
            AAPT=$(ls "${ANDROID_HOME}"/build-tools/*/aapt 2>/dev/null | tail -1)
            [ -n "$AAPT" ] || fail "找不到 aapt/aapt2，无法校验清单"
            "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$MANIFEST"
          fi
          grep -qi 'INTERNET' "$MANIFEST" || fail "清单缺少 INTERNET 权限"
          grep -qi 'networkSecurityConfig' "$MANIFEST" || fail "清单缺少 networkSecurityConfig（127.0.0.1 明文 HTTP 会被挡）"
          echo "APK 内容校验通过：Node 脚本、libnode、JNI 壳、libC++、清单权限与网络策略都在"

      # 收集成「平铺目录 + 固定文件名」再上传：
      # upload-artifact v4 以通配符之前的前缀作为压缩根，直接上传 apk/**/*.apk 解包后是
      # debug/app-debug.apk（多一层），下游 release job 用平铺通配符就收集不到 → APK 静默丢失。
      # 详见 scripts/collect-apk.js 与它的单测。
      - name: Collect APK (flat, fixed name)
        working-directory: platforms/mobile
        run: |
          node scripts/collect-apk.js
          ls -lh out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-artifacts
          # out/ 即压缩根 → 解包后 APK 必定在顶层，文件名也稳定。
          path: platforms/mobile/out/*.apk
          # 没打出 APK 必须显式失败（此前 warn 让"没产出"被绿灯掩盖）。
          if-no-files-found: error

  # ---------- 滚动 test release ----------
  release:
    needs: [web, electron, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      # 收集 + 校验 + 平铺。为什么必须递归查：
      #   upload-artifact v4 以「通配符之前的前缀」作为压缩根，产物可能落在 artifacts 的子目录里
      #   （APK 曾经就是 artifacts/debug/app-debug.apk），用平铺的 artifacts/*.apk 会**静默漏掉**。
      # 为什么校验必须排在「删除旧 release」之前：否则会先删掉上一版发布、再失败，留下空窗。
      - name: Collect and verify release files
        run: |
          mkdir -p publish
          # 递归收集（zip/exe/apk），并把清单写盘，供创建步骤复用（两处各自拼通配符必然漂移）。
          : > release-files.txt
          while IFS= read -r f; do
            cp "$f" publish/
            echo "publish/$(basename "$f")" >> release-files.txt
          done < <(find artifacts -type f \( -name '*.zip' -o -name '*.exe' -o -name '*.apk' \) | sort)
          echo "本次将发布 $(wc -l < release-files.txt) 个产物："
          cat release-files.txt
          # mobile job 成功却没有 APK：一定是上传/下载路径的问题，直接失败（曾经静默漏掉过）。
          if [ "${{ needs.mobile.result }}" = "success" ] && ! find publish -type f -name '*.apk' | grep -q .; then
            echo "::error title=APK 产物丢失::mobile job 成功，但收集到的产物里没有 .apk（检查 upload-artifact 的 path 是否为平铺目录）"
            find artifacts -type f | sort
            exit 1
          fi
          # 三类产物都不在：说明 artifact 传递整条链路都断了，同样必须失败。
          if [ ! -s release-files.txt ]; then
            echo "::error title=没有任何产物::artifacts/ 下没有收集到 zip/exe/apk"
            find artifacts -type f | sort
            exit 1
          fi

      # 先删旧 release（--cleanup-tag 连 tag 一起删；不存在时忽略失败）。
      - name: Delete previous test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete test --yes --cleanup-tag || echo "没有旧 test release，跳过"

      # 再创建新的 test release，把本次产物全部附上。
      # 用 --latest（正式发布）而不是 --prerelease：后者不会出现在侧栏与 /releases/latest 上。
      - name: Create rolling test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 读取上一步收集好的清单（空文件 → 空数组，不报错）。
          mapfile -t FILES < release-files.txt
          echo "将发布：${FILES[*]}"
          # 生成说明（含提交信息，便于对照"这一版打包的是哪次提交"）。
          cat > notes.md <<EOF
          ## Test Release（滚动）

          本 release 由每次 push 到 main 自动重建，**始终只有最新一份**。

          - 提交：\`${GITHUB_SHA}\`
          - 分支：\`${GITHUB_REF_NAME}\`
          - 触发：${GITHUB_EVENT_NAME}
          - 运行：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ### 产物
          - \`liferestart-frontend-dist.zip\` — 网页版构建产物（Vite dist，含 data/ 与 mods/）
          - \`liferestart-web.zip\` — Web 单进程版（静态 + 内嵌 AI 代理，解压即运行）
          - \`*.exe\` — 桌面版安装包（存在时才有；由 electron-builder 产出）
          - \`liferestart-mobile-debug.apk\` — 移动版 debug 包（Capacitor + Gradle 现场构建，**内置 Node 运行时**：AI 代理在 App 内跑，监听 127.0.0.1:8787）

          > 移动包的体积主要来自内置的 Node 运行时（\`libnode.so\` 每个 ABI 约 56~62 MB，已开启压缩打包）；
          > 安装后可在 logcat 用 \`LiferestartNode\` 标签查看 Node 侧日志。

          > 这是**滚动测试发布**（每次 push 重建，始终只有最新一份），仅用于验证构建与分发流程。
          EOF
          # 创建（无产物时仅创建 release，不报错）。
          if [ ${#FILES[@]} -eq 0 ]; then
            gh release create test --latest --title "Test Release (${GITHUB_SHA:0:7})" --notes-file notes.md
          else
            gh release create test "${FILES[@]}" --latest --title "Test Release (${GITHUB_SHA:0:7})" --notes-file notes.md
          fi
