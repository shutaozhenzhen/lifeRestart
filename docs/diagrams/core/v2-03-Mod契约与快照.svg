<text xml:space="preserve" text-anchor="start" x="113.25" y="-682" font-family="Microsoft YaHei" font-size="10.00">开局前一次（boot 内，按序）</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-662.5" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">onYearBefore(ctx)</text>
<text xml:space="preserve" text-anchor="start" x="113.25" y="-659.75" font-family="Microsoft YaHei" font-size="10.00">每年第一段（如结算上一年遗留效果）</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-640.25" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">onYear(ctx)</text>
<text xml:space="preserve" text-anchor="start" x="113.25" y="-637.5" font-family="Microsoft YaHei" font-size="10.00">每年主逻辑（内容 Mod 的主战场）</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-618" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">onYearAfter(ctx)</text>
<text xml:space="preserve" text-anchor="start" x="113.25" y="-615.25" font-family="Microsoft YaHei" font-size="10.00">每年第三段（如统一收尾 / 检查结束条件）</text>
<text xml:space="preserve" text-anchor="start" x="13" y="-595.75" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">dispose(ctx)</text>
<text xml:space="preserve" text-anchor="start" x="113.25" y="-593" font-family="Microsoft YaHei" font-size="10.00">结束时逆序调用（runtime.dispose）</text>
