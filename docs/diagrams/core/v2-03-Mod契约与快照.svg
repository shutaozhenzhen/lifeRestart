<text xml:space="preserve" text-anchor="start" x="892.12" y="-398.38" font-family="Microsoft YaHei" font-size="10.00" fill="white">三条硬约束（贯穿 ctx / clock / runtime，都有测试）</text>
<text xml:space="preserve" text-anchor="start" x="799.38" y="-369.75" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">① 守卫</text>
<text xml:space="preserve" text-anchor="start" x="861.12" y="-374.13" font-family="Microsoft YaHei" font-size="10.00">钩子之外调用 ctx.set / emit / log / rng.* / end 一律抛错（isActive 检查）</text>
<text xml:space="preserve" text-anchor="start" x="861.12" y="-359.88" font-family="Microsoft YaHei" font-size="10.00">→ 异步续作不能偷偷改状态</text>
<text xml:space="preserve" text-anchor="start" x="799.38" y="-331.25" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">② 冲突检测</text>
<text xml:space="preserve" text-anchor="start" x="861.12" y="-335.63" font-family="Microsoft YaHei" font-size="10.00">同一年 + 同一路径被不同 mod 写入 → emit core:conflict { path, mods: [旧, 新] }</text>
<text xml:space="preserve" text-anchor="start" x="861.12" y="-321.38" font-family="Microsoft YaHei" font-size="10.00">只报不拦（全局共享 KV，覆盖是允许的）</text>
<text xml:space="preserve" text-anchor="start" x="799.38" y="-292.75" font-family="Microsoft YaHei" font-weight="bold" font-size="10.00">③ 错误隔离</text>
<text xml:space="preserve" text-anchor="start" x="861.12" y="-297.13" font-family="Microsoft YaHei" font-size="10.00">单个钩子抛错 → core:error { phase, message }，其他 mod 继续</text>
<text xml:space="preserve" text-anchor="start" x="861.12" y="-282.88" font-family="Microsoft YaHei" font-size="10.00">只留 message 不留 stack：stack 含绝对路径，会让跨机 hash 不一致</text>
</g>
